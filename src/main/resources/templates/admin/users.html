<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Administration</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            Chinook Album API
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active"
                       aria-current="page"
                       th:href="@{/admin/users}">Admin</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/logout}">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container mt-5">

<h2 class="mb-4">User Administration</h2>
    <div class="card shadow">
        <div class="card-body">

            <h4 class="card-title mb-3">Registered Users</h4>

            <div class="table-responsive">
                <table class="table table-striped table-bordered align-middle">

                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Password Change Required</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="user : ${users}">

                        <td th:text="${user.userId}"></td>

                        <td th:text="${user.username}"></td>

                        <td th:text="${user.role}"></td>

                        <td>
                            <span th:if="${user.enabled}"
                                  class="badge bg-success">
                                Enabled
                            </span>

                            <span th:unless="${user.enabled}"
                                  class="badge bg-danger">
                                Disabled
                            </span>
                        </td>

                        <td>
                            <span th:if="${user.passwordChangeRequired}"
                                  class="badge bg-warning text-dark">
                                Yes
                            </span>

                            <span th:unless="${user.passwordChangeRequired}"
                                  class="badge bg-secondary">
                                No
                            </span>
                        </td>

                        <td>
                            <div class="d-flex flex-wrap gap-2">

                                <form th:action="@{/admin/users/{id}/toggle(id=${user.userId})}"
                                      method="post">

                                    <button type="submit"
                                            class="btn btn-sm"
                                            th:classappend="${user.enabled} ? 'btn-warning' : 'btn-success'"
                                            th:text="${user.enabled} ? 'Disable' : 'Enable'">
                                    </button>

                                </form>

                                <form th:action="@{/admin/users/{id}/reset-password(id=${user.userId})}"
                                      method="post">

                                    <button type="submit"
                                            class="btn btn-sm btn-outline-primary">
                                        Reset Password
                                    </button>

                                </form>

                            </div>
                        </td>

                    </tr>
                    </tbody>

                </table>
            </div>

        </div>
    </div>

</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
